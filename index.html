document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

style=\"display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-bottom:20px;\">\n      <span style=\"display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;padding:5px 12px;border-radius:20px;background:#FFE4D4;color:#FF5A1E;\"><svg width=\"9\" height=\"9\" viewBox=\"0 0 10 10\"><rect x=\"3\" y=\"0\" width=\"4\" height=\"4\" transform=\"rotate(45 5 5)\" fill=\"#FF5A1E\"><\u002Frect><\u002Fsvg>Призомания<\u002Fspan>\n      <span style=\"display:inline-flex;align-items:center;font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;padding:5px 12px;border-radius:20px;background:#FFF1D6;color:#D97706;\">Ежемесячно<\u002Fspan>\n      <span style=\"display:inline-flex;align-items:center;font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;padding:5px 12px;border-radius:20px;background:#FFEEE4;color:#FF5A1E;\">для агентов<\u002Fspan>\n    <\u002Fdiv>\n    <h1 style=\"font-family:'Odds','Rubik',sans-serif;font-size:clamp(2.9rem,12vw,4.4rem);line-height:0.96;margin:0 0 14px;background:linear-gradient(115deg,#FF5A1E 0%,#FF8A00 40%,#FF4D1E 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;\">Продавай<br>и выигрывай<\u002Fh1>\n    <p style=\"font-size:16px;line-height:1.6;color:#5A5950;max-width:380px;margin:0 auto 12px;font-weight:500;\">Оформляй аванс Мокка и участвуй в ежемесячном розыгрыше<\u002Fp>\n    <div style=\"font-family:'Odds','Rubik',sans-serif;font-size:clamp(2.8rem,13vw,4.6rem);line-height:1;background:linear-gradient(115deg,#FF5A1E 0%,#FF8A00 40%,#FF4D1E 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:nowrap;margin:0 0 22px;\">500 000 ₽<\u002Fdiv>\n    <a href=\"#pmSteps\" style=\"display:inline-block;background:linear-gradient(135deg,#FF5A1E,#FF3D00);color:#fff;font-size:16px;font-weight:800;padding:16px 34px;border-radius:16px;text-decoration:none;box-shadow:0 8px 24px rgba(255,90,30,0.38);\">Участвую →<\u002Fa>\n    <p style=\"font-size:12px;color:#9A9890;margin:14px 0 0;font-weight:500;\">Акция для агентов Мокка · 3 продажи = вход в розыгрыш<\u002Fp>\n    <\u002Fdiv>\n    <img src=\"fd76f3c9-7865-4da2-a7d3-c672f7e52f27\" alt=\"Деньги Мокка\" style=\"width:100%;max-width:440px;justify-self:center;display:block;animation:pmfloat 5s ease-in-out infinite;filter:drop-shadow(0 18px 34px rgba(224,74,0,0.22));\">\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"position:relative;overflow:hidden;background:linear-gradient(135deg,#FFF1E8 0%,#FFF6EC 55%,#FFF3E0 100%);padding:0 16px clamp(34px,8vw,52px);\">\n  <div id=\"pmMoneyBand\" style=\"position:relative;height:74px;margin:0 -16px 22px;overflow:hidden;border-bottom:2px dashed #FFD7C2;background:linear-gradient(90deg,#FFE9D6,#FFF3E0,#FFE9D6);\"><\u002Fdiv>\n  <div style=\"max-width:1060px;margin:0 auto;text-align:center;\">\n    <div style=\"font-family:'Odds','Rubik',sans-serif;font-size:clamp(2.9rem,14vw,5.2rem);line-height:1;background:linear-gradient(115deg,#FF5A1E 0%,#FF8A00 40%,#FF4D1E 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:nowrap;margin:6px 0 4px;\">500 000 ₽<\u002Fdiv>\n    <div style=\"font-size:15px;font-weight:600;color:#5A5950;margin-bottom:6px;\">Разыгрываем среди агентов Мокка<\u002Fdiv>\n    <div style=\"font-size:13px;font-weight:700;color:#FF5A1E;margin-bottom:24px;\">Уже наградили 250 агентов на ~400 000 ₽<\u002Fdiv>\n    <div style=\"font-size:11px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:#FF5A1E;margin-bottom:14px;\">Трать на что хочешь<\u002Fdiv>\n    <div style=\"display:flex;justify-content:safe center;gap:12px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x proximity;scroll-padding-left:16px;-webkit-overflow-scrolling:touch;\">\n      <div style=\"flex:0 0 190px;scroll-snap-align:start;background:#fff;border-radius:22px;padding:16px 16px 18px;border:1px solid #FFE0CC;box-shadow:0 4px 14px rgba(255,90,30,0.07);\">\n        <img src=\"f1006101-3a79-4e77-8850-34894c505d41\" alt=\"Кроссовки\" style=\"width:100%;aspect-ratio:1/1;object-fit:contain;display:block;margin-bottom:10px;\">\n        <div style=\"font-size:15px;font-weight:800;color:#FF5A1E;\">Обнови кроссовки<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:0 0 190px;scroll-snap-align:start;background:#fff;border-radius:22px;padding:16px 16px 18px;border:1px solid #FFE0CC;box-shadow:0 4px 14px rgba(255,90,30,0.07);\">\n        <img src=\"1387b5e1-075d-4676-92ab-920fc7f3a975\" alt=\"Гаджеты\" style=\"width:100%;aspect-ratio:1/1;object-fit:contain;display:block;margin-bottom:10px;\">\n        <div style=\"font-size:15px;font-weight:800;color:#FF5A1E;\">Купи гаджет<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:0 0 190px;scroll-snap-align:start;background:#fff;border-radius:22px;padding:16px 16px 18px;border:1px solid #FFE0CC;box-shadow:0 4px 14px rgba(255,90,30,0.07);\">\n        <img src=\"61cce6af-67c2-4910-877e-12a768dac841\" alt=\"Детям\" style=\"width:100%;aspect-ratio:1/1;object-fit:contain;display:block;margin-bottom:10px;\">\n        <div style=\"font-size:15px;font-weight:800;color:#FF5A1E;\">Порадуй детей<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:0 0 190px;scroll-snap-align:start;background:#fff;border-radius:22px;padding:16px 16px 18px;border:1px solid #FFE0CC;box-shadow:0 4px 14px rgba(255,90,30,0.07);\">\n        <img src=\"6257066f-be7c-4fe1-bdec-4819c42d4c75\" alt=\"Путешествия\" style=\"width:100%;aspect-ratio:1/1;object-fit:contain;display:block;margin-bottom:10px;\">\n        <div style=\"font-size:15px;font-weight:800;color:#FF5A1E;\">Махни в отпуск<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"pmSteps\" style=\"padding:clamp(34px,9vw,56px) 16px;scroll-margin-top:60px;\">\n  <div style=\"max-width:860px;margin:0 auto;\">\n    <div style=\"text-align:center;margin-bottom:26px;\">\n      <span style=\"font-size:10px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;color:#FF5A1E;\">Проще некуда<\u002Fspan>\n      <h2 style=\"font-family:'Odds','Rubik',sans-serif;font-size:clamp(1.9rem,7vw,2.6rem);font-weight:400;line-height:1.05;background:linear-gradient(115deg,#FF5A1E 0%,#FF8A00 40%,#FF4D1E 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin:8px 0 0;\">Три простых действия<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));\">\n      <div style=\"background:linear-gradient(160deg,#FFF1E8,#FFFFFF);border:2px solid #FFE4D4;border-radius:22px;padding:24px 18px;text-align:center;\">\n        <div style=\"position:relative;width:64px;height:64px;margin:0 auto 14px;border-radius:18px;background:#FFE4D4;display:flex;align-items:center;justify-content:center;\">\n          <svg width=\"42\" height=\"42\" viewBox=\"0 0 48 48\"><circle cx=\"24\" cy=\"24\" r=\"16\" fill=\"#FBBF24\"><\u002Fcircle><circle cx=\"24\" cy=\"24\" r=\"11.5\" fill=\"#FF8A00\"><\u002Fcircle><text x=\"24\" y=\"31\" font-size=\"18\" font-weight=\"900\" fill=\"#fff\" text-anchor=\"middle\" font-family=\"Rubik,sans-serif\">₽<\u002Ftext><\u002Fsvg>\n          <span style=\"position:absolute;top:-8px;left:-8px;width:26px;height:26px;border-radius:50%;background:#FF5A1E;color:#fff;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;\">1<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:17px;font-weight:800;color:#FF5A1E;margin-bottom:5px;\">Сделай три продажи<\u002Fdiv>\n        <div style=\"font-size:13.5px;line-height:1.55;color:#5A5950;\">Оформляй аванс Мокка. Минимум <b style=\"color:#1C1C1A;\">3 продажи<\u002Fb> в месяц — и ты в розыгрыше<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:linear-gradient(160deg,#FFF7E8,#FFFFFF);border:2px solid #FBE7C2;border-radius:22px;padding:24px 18px;text-align:center;\">\n        <div style=\"position:relative;width:64px;height:64px;margin:0 auto 14px;border-radius:18px;background:#FBE3B0;display:flex;align-items:center;justify-content:center;\">\n          <svg width=\"42\" height=\"42\" viewBox=\"0 0 48 48\"><rect x=\"8\" y=\"8\" width=\"32\" height=\"32\" rx=\"11\" fill=\"#F59E0B\"><\u002Frect><path d=\"M24 33V17M24 17l-7 7M24 17l7 7\" stroke=\"#fff\" stroke-width=\"3.4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n          <span style=\"position:absolute;top:-8px;left:-8px;width:26px;height:26px;border-radius:50%;background:#D97706;color:#fff;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;\">2<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:17px;font-weight:800;color:#D97706;margin-bottom:5px;\">Продавай больше<\u002Fdiv>\n        <div style=\"font-size:13.5px;line-height:1.55;color:#5A5950;\">Каждая продажа <b style=\"color:#1C1C1A;\">сверх трёх<\u002Fb> — это +1 шанс на победу<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:linear-gradient(160deg,#FFF1E8,#FFFFFF);border:2px solid #FFE4D4;border-radius:22px;padding:24px 18px;text-align:center;\">\n        <div style=\"position:relative;width:64px;height:64px;margin:0 auto 14px;border-radius:18px;background:#FFE4D4;display:flex;align-items:center;justify-content:center;\">\n          <svg width=\"42\" height=\"42\" viewBox=\"0 0 48 48\"><path d=\"M14 8h20v9a10 10 0 0 1-20 0z\" fill=\"#FBBF24\"><\u002Fpath><path d=\"M14 11H9a3 3 0 0 0 0 6c2.5 0 4-1.5 5-3.5M34 11h5a3 3 0 0 1 0 6c-2.5 0-4-1.5-5-3.5\" stroke=\"#FF5A1E\" stroke-width=\"2.6\" fill=\"none\" stroke-linecap=\"round\"><\u002Fpath><rect x=\"21\" y=\"26\" width=\"6\" height=\"7\" fill=\"#FF5A1E\"><\u002Frect><rect x=\"14\" y=\"33\" width=\"20\" height=\"5\" rx=\"2.5\" fill=\"#E04A00\"><\u002Frect><\u002Fsvg>\n          <span style=\"position:absolute;top:-8px;left:-8px;width:26px;height:26px;border-radius:50%;background:#FF5A1E;color:#fff;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;\">3<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:17px;font-weight:800;color:#FF5A1E;margin-bottom:5px;\">Выигрывай<\u002Fdiv>\n        <div style=\"font-size:13.5px;line-height:1.55;color:#5A5950;\">Забери приз — <b style=\"color:#1C1C1A;\">до 15 000 ₽<\u002Fb> каждому победителю<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background:#fff;border-top:1px solid #E8E8E6;padding:clamp(34px,9vw,56px) 16px;\">\n  <div style=\"max-width:560px;margin:0 auto;\">\n    <div style=\"text-align:center;margin-bottom:24px;\">\n      <span style=\"font-size:10px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;color:#FF5A1E;\">Подробности<\u002Fspan>\n      <h2 style=\"font-family:'Odds','Rubik',sans-serif;font-size:clamp(1.9rem,7vw,2.6rem);font-weight:400;line-height:1.05;background:linear-gradient(115deg,#FF5A1E 0%,#FF8A00 40%,#FF4D1E 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin:8px 0 0;\">Вопросы и условия<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:12px;\">\n\n      <div style=\"border:1.5px solid #FFE4D4;border-radius:18px;overflow:hidden;background:#FFFBF8;\">\n        <div onclick=\"{{ t0 }}\" style=\"display:flex;align-items:center;gap:12px;padding:17px 18px;cursor:pointer;user-select:none;\">\n          <span style=\"font-size:15px;font-weight:800;color:#FF5A1E;flex:1;\">Как считаются шансы?<\u002Fspan>\n          <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" style=\"flex-shrink:0;transition:transform .25s;transform:{{ r0 }};\"><path d=\"M6 9l6 6 6-6\" stroke=\"#FF5A1E\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <sc-if value=\"{{ o0 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:0 18px 18px;font-size:14px;line-height:1.65;color:#5A5950;\">3 продажи дают первый шанс на приз. Каждая следующая продажа (4-я, 5-я, 10-я…) добавляет <b style=\"color:#1C1C1A;\">ещё один шанс<\u002Fb>. Чем больше продаёшь — тем выше вероятность выиграть.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"border:1.5px solid #FBE7C2;border-radius:18px;overflow:hidden;background:#FFFCF5;\">\n        <div onclick=\"{{ t1 }}\" style=\"display:flex;align-items:center;gap:12px;padding:17px 18px;cursor:pointer;user-select:none;\">\n          <span style=\"font-size:15px;font-weight:800;color:#D97706;flex:1;\">Какие условия участия?<\u002Fspan>\n          <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" style=\"flex-shrink:0;transition:transform .25s;transform:{{ r1 }};\"><path d=\"M6 9l6 6 6-6\" stroke=\"#D97706\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <sc-if value=\"{{ o1 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:0 18px 18px;font-size:14px;line-height:1.65;color:#5A5950;\">Акция бессрочная и проходит каждый месяц. Новый период стартует 1-го числа, засчитываются все твои продажи авансом Мокка за текущий месяц — минимум <b style=\"color:#1C1C1A;\">3 продажи<\u002Fb>, и ты в розыгрыше. Участвуют все агенты Мокка.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"border:1.5px solid #FFE4D4;border-radius:18px;overflow:hidden;background:#FFFBF8;\">\n        <div onclick=\"{{ t2 }}\" style=\"display:flex;align-items:center;gap:12px;padding:17px 18px;cursor:pointer;user-select:none;\">\n          <span style=\"font-size:15px;font-weight:800;color:#FF5A1E;flex:1;\">Когда розыгрыш и итоги?<\u002Fspan>\n          <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" style=\"flex-shrink:0;transition:transform .25s;transform:{{ r2 }};\"><path d=\"M6 9l6 6 6-6\" stroke=\"#FF5A1E\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <sc-if value=\"{{ o2 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:4px 18px 18px;\">\n            <div style=\"display:flex;gap:12px;\">\n              <div style=\"display:flex;flex-direction:column;align-items:center;padding-top:4px;\">\n                <div style=\"width:12px;height:12px;border-radius:50%;background:#FF5A1E;flex-shrink:0;\"><\u002Fdiv>\n                <div style=\"width:2px;flex:1;background:#FFE4D4;margin:3px 0;\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"padding-bottom:14px;\"><div style=\"font-size:12px;font-weight:800;color:#FF5A1E;text-transform:uppercase;letter-spacing:0.6px;\">1-е число<\u002Fdiv><div style=\"font-size:13px;color:#5A5950;line-height:1.5;\">Старт нового месяца. Каждая продажа идёт в зачёт<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:12px;\">\n              <div style=\"display:flex;flex-direction:column;align-items:center;padding-top:4px;\">\n                <div style=\"width:12px;height:12px;border-radius:50%;background:#F59E0B;flex-shrink:0;\"><\u002Fdiv>\n                <div style=\"width:2px;flex:1;background:#FBE3B0;margin:3px 0;\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"padding-bottom:14px;\"><div style=\"font-size:12px;font-weight:800;color:#D97706;text-transform:uppercase;letter-spacing:0.6px;\">Последний день месяца<\u002Fdiv><div style=\"font-size:13px;color:#5A5950;line-height:1.5;\">Успей добрать продажи до конца месяца<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:12px;\">\n              <div style=\"display:flex;flex-direction:column;align-items:center;padding-top:4px;\">\n                <div style=\"width:12px;height:12px;border-radius:50%;background:#FF5A1E;flex-shrink:0;\"><\u002Fdiv>\n                <div style=\"width:2px;flex:1;background:#FFE4D4;margin:3px 0;\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"padding-bottom:14px;\"><div style=\"font-size:12px;font-weight:800;color:#FF5A1E;text-transform:uppercase;letter-spacing:0.6px;\">Первые дни месяца<\u002Fdiv><div style=\"font-size:13px;color:#5A5950;line-height:1.5;\">Розыгрыш по итогам прошлого месяца. Победителям позвоним сами<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:12px;\">\n              <div style=\"display:flex;flex-direction:column;align-items:center;padding-top:4px;\">\n                <div style=\"width:12px;height:12px;border-radius:50%;background:#D97706;flex-shrink:0;\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div><div style=\"font-size:12px;font-weight:800;color:#D97706;text-transform:uppercase;letter-spacing:0.6px;\">После розыгрыша<\u002Fdiv><div style=\"font-size:13px;color:#5A5950;line-height:1.5;\">Получаешь приз и тратишь на что хочешь<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"border:1.5px solid #FBE7C2;border-radius:18px;overflow:hidden;background:#FFFCF5;\">\n        <div onclick=\"{{ t3 }}\" style=\"display:flex;align-items:center;gap:12px;padding:17px 18px;cursor:pointer;user-select:none;\">\n          <span style=\"font-size:15px;font-weight:800;color:#D97706;flex:1;\">Нужно ли регистрироваться?<\u002Fspan>\n          <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" style=\"flex-shrink:0;transition:transform .25s;transform:{{ r3 }};\"><path d=\"M6 9l6 6 6-6\" stroke=\"#D97706\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <sc-if value=\"{{ o3 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:0 18px 18px;font-size:14px;line-height:1.65;color:#5A5950;\"><b style=\"color:#1C1C1A;\">Нет.<\u002Fb> Продажи фиксируются в кабинете агента автоматически — отдельно регистрироваться не нужно. Победителям позвоним сами.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"border:1.5px solid #FFE4D4;border-radius:18px;overflow:hidden;background:#FFFBF8;\">\n        <div onclick=\"{{ t4 }}\" style=\"display:flex;align-items:center;gap:12px;padding:17px 18px;cursor:pointer;user-select:none;\">\n          <span style=\"font-size:15px;font-weight:800;color:#FF5A1E;flex:1;\">В каком виде приз?<\u002Fspan>\n          <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" style=\"flex-shrink:0;transition:transform .25s;transform:{{ r4 }};\"><path d=\"M6 9l6 6 6-6\" stroke=\"#FF5A1E\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <sc-if value=\"{{ o4 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:0 18px 18px;font-size:14px;line-height:1.65;color:#5A5950;\">Общий призовой фонд — <b style=\"color:#1C1C1A;\">500 000 ₽ каждый месяц<\u002Fb>. Приз выдаётся сертификатами партнёров Мокка, номиналом <b style=\"color:#1C1C1A;\">до 15 000 ₽<\u002Fb> — их можно потратить на покупки.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background:linear-gradient(135deg,#FFE6D6,#FFF1E8,#FFF3E0);border-top:1px solid #E8E8E6;padding:clamp(40px,10vw,64px) 16px;text-align:center;\">\n  <div style=\"max-width:560px;margin:0 auto;\">\n    <h2 style=\"font-family:'Odds','Rubik',sans-serif;font-size:clamp(2.2rem,10vw,3.4rem);line-height:1;background:linear-gradient(115deg,#FF5A1E,#FF8A00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin:0 0 12px;\">Розыгрыш проходит каждый месяц<\u002Fh2>\n    <p style=\"font-size:15px;line-height:1.65;color:#5A5950;margin:0 auto 22px;max-width:340px;\">Просто продавай аванс Мокка как обычно — продажи учитываются автоматически<\u002Fp>\n    <a href=\"https://pa.mokka.ru\" style=\"display:inline-block;background:linear-gradient(135deg,#FF5A1E,#FF3D00);color:#fff;font-size:16px;font-weight:800;padding:16px 34px;border-radius:16px;text-decoration:none;box-shadow:0 8px 24px rgba(255,90,30,0.38);\">Открыть кабинет →<\u002Fa>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background:#FAFAF8;padding:18px 16px;\">\n  <a href=\"https://welcome.mokka.ru\" style=\"display:flex;align-items:center;gap:14px;max-width:560px;margin:0 auto;background:#fff;border:1px solid #E8E8E6;border-radius:16px;padding:15px 17px;text-decoration:none;\">\n    <span style=\"flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;background:#FFF4EE;\">\n      <svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M4 5.5A1.5 1.5 0 0 1 5.5 4H11v15H5.5A1.5 1.5 0 0 1 4 17.5z\" fill=\"#FF5A1E\"><\u002Fpath><path d=\"M20 5.5A1.5 1.5 0 0 0 18.5 4H13v15h5.5A1.5 1.5 0 0 0 20 17.5z\" fill=\"#FF8A5C\"><\u002Fpath><\u002Fsvg>\n    <\u002Fspan>\n    <div style=\"flex:1;\">\n      <div style=\"font-size:14px;font-weight:800;color:#1C1C1A;margin-bottom:2px;\">Давно не работал с Мокка?<\u002Fdiv>\n      <div style=\"font-size:12px;color:#5A5950;line-height:1.45;\">Освежи в памяти, как оформлять аванс — на welcome.mokka.ru<\u002Fdiv>\n    <\u002Fdiv>\n    <span style=\"font-size:18px;color:#9A9890;\">→<\u002Fspan>\n  <\u002Fa>\n<\u002Fsection>\n\n<footer style=\"background:#FF5A1E;padding:clamp(24px,6vw,32px) 16px;text-align:center;color:#fff;\">\n  <img src=\"e8bc9bab-600d-48b1-b6cb-2cf28b33d348\" alt=\"Мокка\" style=\"height:30px;object-fit:contain;margin-bottom:12px;\">\n  <div style=\"font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:#FFFFFF;margin-bottom:8px;\">Поддержка агентов<\u002Fdiv>\n  <div style=\"display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-bottom:10px;\">\n    <a href=\"tel:88007077236\" style=\"color:rgba(255,255,255,0.9);font-size:13px;text-decoration:none;font-weight:600;\">8 800 707-72-36 доб. 1<\u002Fa>\n    <a href=\"mailto:support@mokka.ru\" style=\"color:rgba(255,255,255,0.9);font-size:13px;text-decoration:none;font-weight:600;\">support@mokka.ru<\u002Fa>\n  <\u002Fdiv>\n  <div style=\"font-size:11px;color:rgba(255,255,255,0.65);\">© Мокка, 2026 · Розыгрыш проходит каждый месяц<\u002Fdiv>\n<\u002Ffooter>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;confetti&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Оформление&quot;}}\">\nclass Component extends DCLogic {\n  state = { open: -1 };\n  toggle(i){ this.setState(s => ({ open: s.open === i ? -1 : i })); }\n  componentDidMount(){\n    if (this.props.confetti ?? true) this.makeRain();\n    this.makeBand();\n  }\n  makeRain(){\n    const box = document.getElementById('pmConfetti');\n    if (!box) return;\n    box.innerHTML = '';\n    for (let i = 0; i < 15; i++){\n      const el = document.createElement('div');\n      const w = 40 + Math.random()*28;\n      el.style.cssText = [\n        'position:absolute','top:-60px',\n        'left:' + (Math.random()*100) + '%',\n        'width:' + w + 'px','height:' + (w*0.563) + 'px',\n        \"background:url('\" + ((window.__resources&&window.__resources.ticketMokka)||'./assets/ticket-mokka.webp') + \"') center/contain no-repeat\",\n        'opacity:' + (0.55 + Math.random()*0.4),\n        'animation:pmfall ' + (6 + Math.random()*6) + 's ' + (Math.random()*7) + 's linear infinite',\n        'filter:drop-shadow(0 4px 6px rgba(224,74,0,0.18))'\n      ].join(';');\n      box.appendChild(el);\n    }\n  }\n  makeBand(){\n    const band = document.getElementById('pmMoneyBand');\n    if (!band) return;\n    band.innerHTML = '';\n    const track = document.createElement('div');\n    track.style.cssText = 'position:absolute;top:0;left:0;height:100%;display:flex;align-items:center;gap:30px;padding:0 15px;animation:pmscroll 24s linear infinite;will-change:transform;';\n    const rots = [-9, 6, -4, 11, -7, 3, -12, 8, -5, 10];\n    const build = (offset) => {\n      for (let i = 0; i < 10; i++){\n        const el = document.createElement('div');\n        const w = 92;\n        el.style.cssText = [\n          'flex:0 0 auto',\n          'width:' + w + 'px','height:' + (w*0.563) + 'px',\n          \"background:url('\" + ((window.__resources&&window.__resources.ticketMokka)||'./assets/ticket-mokka.webp') + \"') center/contain no-repeat\",\n          'transform:rotate(' + rots[i] + 'deg)',\n          'filter:drop-shadow(0 3px 5px rgba(224,74,0,0.16))'\n        ].join(';');\n        track.appendChild(el);\n      }\n    };\n    build(); build(); // duplicate set for seamless -50% loop\n    band.appendChild(track);\n  }\n  renderVals(){\n    const o = i => this.state.open === i;\n    const t = i => () => this.toggle(i);\n    return {\n      o0:o(0), o1:o(1), o2:o(2), o3:o(3), o4:o(4),\n      t0:t(0), t1:t(1), t2:t(2), t3:t(3), t4:t(4),\n      r0:o(0)?'rotate(180deg)':'rotate(0deg)',\n      r1:o(1)?'rotate(180deg)':'rotate(0deg)',\n      r2:o(2)?'rotate(180deg)':'rotate(0deg)',\n      r3:o(3)?'rotate(180deg)':'rotate(0deg)',\n      r4:o(4)?'rotate(180deg)':'rotate(0deg)'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
